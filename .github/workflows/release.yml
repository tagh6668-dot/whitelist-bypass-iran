name: Build and Release Whitelist Bypass

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Gomobile and Gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Go Library and Android Assets
        run: |
          go -C relay get -tool golang.org/x/mobile/cmd/gobind || true
          ./build-go.sh

      - name: Build Android App (Release APK)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Headless Creator for Ubuntu
        run: |
          go -C headless/bale mod tidy
          go -C headless/bale build -trimpath -ldflags="-s -w" -o headless-bale-creator-linux-x64 .

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy and rename the APK for v8a phones (release build has the native libraries)
          cp android-app/app/build/outputs/apk/release/app-release.apk release-artifacts/whitelist-bypass-v8a.apk
          # Copy the headless Ubuntu creator binary
          cp headless/bale/headless-bale-creator-linux-x64 release-artifacts/headless-bale-creator-linux-x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/

      - name: Generate Tag Name
        id: tag_gen
        run: |
          TAG_NAME="v0.1.2-build$(date +'%Y%m%d-%H%M%S')"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Whitelist Bypass Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/whitelist-bypass-v8a.apk
            release-artifacts/headless-bale-creator-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
