name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Requested Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'

      - name: Install Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize Gomobile
        run: |
          gomobile init

      - name: Build Android Client Bindings (AAR & JNI)
        run: |
          cd relay
          mkdir -p ../android-app/app/libs
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a
          mkdir -p ../android-app/app/src/main/jniLibs/armeabi-v7a

          # Add gomobile tool dependencies to current module
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile

          # Set NDK home dynamically from pre-installed SDK ndk folder
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | head -n 1)
          echo "Using NDK at $ANDROID_NDK_HOME"

          # Build AAR
          gomobile bind -v -target=android -androidapi 23 -o mobile.aar ./androidbind/
          cp mobile.aar ../android-app/app/libs/mobile.aar

          # Cross-compile JNI librelay.so helper binaries
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-checklinkname=0" -o ../android-app/app/src/main/jniLibs/arm64-v8a/librelay.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm   go build -ldflags="-checklinkname=0" -o ../android-app/app/src/main/jniLibs/armeabi-v7a/librelay.so .

      - name: Build Android APK
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../joiner-android-v8a.apk

      - name: Build Windows Client Joiner (32-bit / 386)
        run: |
          cd relay
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -ldflags="-s -w" -o ../joiner-windows-32bit.exe .

      - name: Build Ubuntu Server Creator (Server / amd64)
        run: |
          cd headless/bale
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../creator-ubuntu-server .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            joiner-android-v8a.apk
            joiner-windows-32bit.exe
            creator-ubuntu-server

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            joiner-android-v8a.apk
            joiner-windows-32bit.exe
            creator-ubuntu-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
