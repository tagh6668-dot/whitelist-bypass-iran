name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Requested Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'

      - name: Build Android Client Joiner (arm64-v8a)
        run: |
          cd relay
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w -checklinkname=0" -o ../joiner-android-v8a .

      - name: Build Windows Client Joiner (32-bit / 386)
        run: |
          cd relay
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -trimpath -ldflags="-s -w" -o ../joiner-windows-32bit.exe .

      - name: Build Ubuntu Server Creator (Server / amd64)
        run: |
          cd headless/bale
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../creator-ubuntu-server .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            joiner-android-v8a
            joiner-windows-32bit.exe
            creator-ubuntu-server

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            joiner-android-v8a
            joiner-windows-32bit.exe
            creator-ubuntu-server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
