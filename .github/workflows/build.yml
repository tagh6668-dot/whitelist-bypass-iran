name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build All Requested Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Build Android Client (arm64-v8a)
        run: |
          cd relay
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../android-client-v8a .

      - name: Build Windows Client (32-bit / 386)
        run: |
          cd relay
          GOOS=windows GOARCH=386 go build -trimpath -ldflags="-s -w" -o ../windows-client-32.exe .

      - name: Build Ubuntu Server Creator (Server)
        run: |
          cd headless/bale
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../ubuntu-server-creator .

      - name: Build Ubuntu Server Joiner (Client)
        run: |
          cd headless/bale-joiner
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../ubuntu-server-joiner .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            android-client-v8a
            windows-client-32.exe
            ubuntu-server-creator
            ubuntu-server-joiner

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          name: Release ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android-client-v8a
            windows-client-32.exe
            ubuntu-server-creator
            ubuntu-server-joiner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
