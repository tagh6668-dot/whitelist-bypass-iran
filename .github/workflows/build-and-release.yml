name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install macOS/Windows tools (cross-compile helpers)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nsis

      - name: Configure Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch Android App to only target arm64-v8a
        run: |
          python3 -c '
          with open("android-app/app/build.gradle.kts", "r") as f:
              lines = f.read()
          patched = lines.replace(
              "testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"",
              "testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\n        ndk {\n            abiFilters.add(\"arm64-v8a\")\n        }"
          )
          with open("android-app/app/build.gradle.kts", "w") as f:
              f.write(patched)
          '

      - name: Build Android APK (arm64-v8a)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../prebuilts
          cp app/build/outputs/apk/release/app-release.apk ../prebuilts/whitelist-bypass-v8a.apk

      - name: Build Windows Joiner (32-bit/ia32)
        env:
          RELEASE_PLATFORM: win
        run: |
          # Build desktop-joiner binary
          ./build-desktop-joiner.sh
          
          # Build Electron joiner installer for Windows ia32
          cd joiner-desktop-app
          npm install
          npx tsc
          # Build specifically for windows ia32
          cp desktop-joiner/desktop-joiner-windows-ia32.exe desktop-joiner/desktop-joiner-bundle.exe
          cp desktop-joiner/wintun-ia32.dll desktop-joiner/wintun-bundle.dll
          npx electron-builder --win --ia32 --publish never
          
          # Copy to prebuilts
          mkdir -p ../prebuilts
          # The installer name usually matches WhitelistBypass Setup <version>-ia32.exe
          find dist/ -name "*.exe" -not -name "builder-effective-config.yaml" -exec cp {} ../prebuilts/ \;

      - name: Build Ubuntu Headless Creator
        run: |
          # Build headless bale creator for Linux x64 (which is Ubuntu)
          cd headless/bale
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../prebuilts/headless-bale-creator-ubuntu-x64 .

      - name: List Prebuilts
        run: |
          ls -la prebuilts/

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            prebuilts/*.apk
            prebuilts/*.exe
            prebuilts/headless-bale-creator-ubuntu-x64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
