name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu-and-android:
    name: Build Android and Ubuntu binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch Android App to only target arm64-v8a
        run: |
          python3 -c '
          with open("android-app/app/build.gradle.kts", "r") as f:
              lines = f.read()
          patched = lines.replace(
              "testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"",
              "testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\n        ndk {\n            abiFilters.add(\"arm64-v8a\")\n        }"
          )
          with open("android-app/app/build.gradle.kts", "w") as f:
              f.write(patched)
          '

      - name: Build Android APK (arm64-v8a)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleRelease
          mkdir -p ../prebuilts
          cp app/build/outputs/apk/release/app-release.apk ../prebuilts/whitelist-bypass-v8a.apk

      - name: Build Ubuntu Headless Creator
        run: |
          # Build headless bale creator for Linux x64 (which is Ubuntu)
          cd headless/bale
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../../prebuilts/headless-bale-creator-ubuntu-x64 .

      - name: Upload Linux & Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-android-artifacts
          path: prebuilts/
          if-no-files-found: error

  build-windows:
    name: Build Windows 32-bit Joiner
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Windows Joiner (32-bit/ia32)
        env:
          RELEASE_PLATFORM: win
        run: |
          # Build Go desktop-joiner binary
          chmod +x build-desktop-joiner.sh
          ./build-desktop-joiner.sh
          
          # Build Electron joiner installer for Windows ia32
          cd joiner-desktop-app
          npm install
          npx tsc
          
          # Build specifically for windows ia32
          cp desktop-joiner/desktop-joiner-windows-ia32.exe desktop-joiner/desktop-joiner-bundle.exe
          cp desktop-joiner/wintun-ia32.dll desktop-joiner/wintun-bundle.dll
          
          npx electron-builder --win --ia32 --publish never

      - name: Copy Windows Artifact to Prebuilts
        run: |
          mkdir -p prebuilts
          # If output was written to dist/ instead of prebuilts due to builder configuration
          if [ -d joiner-desktop-app/dist ]; then
            find joiner-desktop-app/dist/ -name "*.exe" -not -name "builder-effective-config.yaml" -exec cp {} prebuilts/ \;
          fi
          echo "Prebuilts content:"
          ls -la prebuilts/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: prebuilts/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-ubuntu-and-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p release-files
          # Only copy the three specific requested files, ignoring internal unpacked folders
          cp artifacts/ubuntu-android-artifacts/whitelist-bypass-v8a.apk release-files/ || true
          cp artifacts/ubuntu-android-artifacts/headless-bale-creator-ubuntu-x64 release-files/ || true
          find artifacts/windows-artifacts/ -maxdepth 1 -name "*ia32.exe" -exec cp {} release-files/ \;
          echo "Files to release:"
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'manual-build' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Manual Build' || github.ref_name }}
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
